name: Build and Upload Container

# The build itself -- tagging per ref so a branch build no longer overwrites `:latest`, the
# registry login, and the check that the image really did come from the shared base -- lives in the
# shared workflow.

permissions:
  contents: read
  packages: read

on:
  push:
    branches: [ main ]
    paths:
      - "envs/pyproject.toml"
      - "containers/**"
      - ".github/workflows/build_and_upload_docker_image.yml"
  pull_request:
    paths:
      - "envs/pyproject.toml"
      - "containers/**"
      - ".github/workflows/build_and_upload_docker_image.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  BuildAndPush:
    uses: dandi-cache/dandi-cache-utils/.github/workflows/cache-image.yml@main
    secrets: inherit
