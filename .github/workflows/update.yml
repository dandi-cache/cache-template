name: Update

# Everything this workflow used to spell out -- the gate against redundant queued runs, the
# checkout, uv, git-annex, the registry login, the image reference, the pipeline invocation and the
# failure notification -- lives in the shared workflow. What stays here is what is genuinely this
# cache's own: when it runs, and what a manual dispatch can change.

permissions:
  contents: read
  packages: read

on:
  schedule:
    - cron: "0 0 * * *"  # TODO: set this cache's schedule.
  workflow_dispatch:
    inputs:
      testing:
        description: "Testing mode: process a handful of items into testing_-prefixed files, leaving the real cache untouched."
        required: false
        type: boolean
        default: false
      limit:
        description: "Cap on new items processed this run. Leave empty to use the limit in cache.toml."
        required: false
        type: string
        default: ""

# Serialize all runs across every ref: an in-progress update is never cancelled, and a run
# triggered while one is executing waits in the queue. The shared workflow's Gate job then skips
# the queued run once it starts, because the update it would perform has just been done.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  Update:
    uses: dandi-cache/dandi-cache-utils/.github/workflows/cache-update.yml@main
    with:
      testing: ${{ inputs.testing || false }}
      limit: ${{ inputs.limit || '' }}
    secrets: inherit
