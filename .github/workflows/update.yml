name: Update

# What stays here is what is genuinely this cache's own: when it runs, and what a manual dispatch
# can change. The gate against redundant queued runs, the runner's environment, the registry login,
# the image, the pipeline and the failure notification are all in the shared action.

permissions:
  contents: read
  packages: read

on:
  schedule:
    - cron: "0 0 * * *"  # TODO: set this cache's schedule.
  workflow_dispatch:
    inputs:
      testing:
        description: "Testing mode: process a handful of items into testing_-prefixed files, leaving the real cache untouched."
        required: false
        type: boolean
        default: false
      limit:
        description: "Cap on new items processed this run. Leave empty to use the limit in cache.toml."
        required: false
        type: string
        default: ""

# Serialize all runs across every ref: an in-progress update is never cancelled, and a run
# triggered while one is executing waits in the queue. The action then skips the queued run once it
# starts, because the update it would perform has just been done.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  Update:
    # Never in the template itself, where the schedule above would run a real update every night
    # against `<cache-name>` and mail the failure. A generated cache is not this repository, so the
    # condition is true there and the job runs; leaving the line in costs that cache nothing.
    if: github.repository != 'dandi-cache/cache-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # So a hung network read cannot burn a full six hours.
    timeout-minutes: 330
    steps:
      - uses: dandi-cache/dandi-cache-action@v3
        with:
          token: ${{ secrets._GITHUB_API_KEY }}
          testing: ${{ inputs.testing || false }}
          limit: ${{ inputs.limit || '' }}
          mail-username: ${{ secrets.MAIL_USERNAME }}
          mail-password: ${{ secrets.MAIL_PASSWORD }}
