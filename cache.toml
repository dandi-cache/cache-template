# The complete declarative description of this cache.
#
# One file, read by both the shared orchestration and this cache's own update code, so the two
# cannot disagree. It replaces what used to be spread across `code/update_pipeline.sh` (the input
# subdataset URLs, paths and branches, the output file names, the entry point, the batch size), the
# update workflow (the image reference), `dataset_description.json`, and the constants at the top of
# `code/update.py`.

[cache]
# The hyphenated repository name. Everything else is derived from it unless overridden:
#   file_stem  -> the underscored form, so `derivatives/<file_stem>.jsonl`
#   image      -> ghcr.io/dandi-cache/<name>
#   outputs    -> ["<file_stem>.jsonl"]
name = "<cache-name>"

# Declare every derivatives file this cache publishes. Only these reach the `dist` branch, which is
# what keeps a `testing_`-prefixed smoke-run artifact from ever reaching consumers.
# outputs = ["<cache_name>.jsonl"]

# GitHub refuses any file over 100 MiB, so an output that could grow near it as one file is kept on
# `derivatives` as sixteen, by the first digit of the content ID. `dist` still publishes it as one
# compressed file, and the update code does not change. Only an output keyed by content ID can split.
# split = ["<cache_name>.jsonl"]


# Upstream caches, registered as DataLad input subdatasets and pinned in every run's provenance, so
# each result records the exact input commits it was computed from.
#
# Delete the whole section for a first-in-chain cache that fetches its own inputs over the network;
# nothing is then pinned, and the container must be able to reach the upstream source at run time.
# Repeat the section for a cache with more than one input.
#
# Only `name` is required. `url`, `path`, `branch` and `file` default to the organization's
# conventions, and `format` says how `dataset.read_input()` parses the file:
#   lookup   one single-key object per line, merged into one mapping   (the usual shape)
#   records  one independent JSON value per line, kept as a list
#   ids      one bare scalar per line, collected into a set
[[inputs]]
name = "<input-cache-name>"
# branch = "derivatives"
# format = "lookup"


# Entry points. `update` always exists and defaults to `code/update.py`; declare extras only when
# this cache genuinely has one, such as a `refresh` that re-assesses what it already recorded.
#
# Declare a `limit`. It is how many items one scheduled run works through, which is how a cache
# meters itself: running often enough is what clears the backlog, and each run still publishes the
# complete cache. A limit bounds *work*, never output -- so it is applied when choosing the batch,
# never to the records on the way out, which would delete the rest of the cache from consumers.
#
# `testing_limit` is the same number for `--testing`: the smallest batch that still exercises this
# operation end to end. Pick it from what one item costs -- two for a cache that streams an NWB
# file, ten for one that reads a small object. There is no default: without one, `--testing` runs
# the ordinary batch and changes only where it writes.
#
# The one cache that declares no limit is the one with nothing to meter: a filter or a join over
# inputs already in hand, which does all of its work every run. Say so in a comment here if that
# is this cache, so the absence reads as a decision.
[operations.update]
limit = 500
testing_limit = 2


# The published branches describe this repository as a BIDS study dataset, through a
# `dataset_description.json` with `DatasetType: "study"`. The pipeline renders that file from this
# section at the start of every run and copies it to `dist`, so it cannot fall behind what is
# declared here.
#
# The copy in this repository is generated from this section too -- never hand-edited -- and the
# build workflow fails if the two stop agreeing. After changing anything below, run:
#
#   dandi-cache dataset-description --declared --output dataset_description.json
#
# Only the metadata this cache knows belongs here. Everything else has a default, and deleting the
# whole section still publishes a valid description:
#
#   title         -> Name                defaults to the cache name
#   authors       -> Authors             omitted unless set
#   license       -> License             defaults to CC-BY-4.0
#   bids_version  -> BIDSVersion         defaults to the shared current release
#   keywords      -> Keywords            omitted unless set
#   references    -> ReferencesAndLinks  defaults to this repository's URL
#
# `dandi-cache dataset-description cache.toml` prints what this cache will publish.
[description]
title = "<cache-name>"
authors = ["<Author Name>"]
