# This cache's own processing dependencies, in one place: the container installs them, and
# `uv run --project envs` recreates the same set locally for debugging.
#
# `datalad` and `datalad-container` are deliberately absent. They never ran inside the image; the
# shared pipeline installs them on the runner from its own pinned requirements.

[project]
# Not this cache's name, and not a placeholder to substitute. The name is cosmetic: this project
# exists so that pip has something to install the dependencies below from, and `<cache-name>` is
# not a name pip accepts, so the image could never be built while it stood here.
name = "cache-environment"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # TODO: add this cache's processing dependencies used by code/update.py.
]

[project.optional-dependencies]
# Only for running outside the container: inside it, the library comes from the base image, and
# installing it again from git would silently replace the version that image was built with.
local = ["dandi-cache-utils @ git+https://github.com/dandi-cache/dandi-cache-utils.git"]
